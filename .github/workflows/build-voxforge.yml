name: Build Pice Voice Windows
on:
  push:
    branches: [voxforge-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Pice Voice Windows x64
        shell: pwsh
        run: dotnet publish PiceVoice/PiceVoice.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "PiceVoice/bin/Release/net8.0-windows/win-x64/publish/PiceVoice.exe"
          if (!(Test-Path $exe)) { throw "PiceVoice.exe missing" }
          Get-Item $exe | Format-List Name,Length,FullName
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: PiceVoice-Windows-x64
          path: PiceVoice/bin/Release/net8.0-windows/win-x64/publish/PiceVoice.exe
          if-no-files-found: error